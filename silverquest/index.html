<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>

<body>
    <div w3-include-html="/templates/navbar.html"></div>

    <h1>SILVERQUEST</h1>

    <div id="output">
        A 'Choose Your Own Adventure' web game in which you play as a dashing young man by the name of 'Silver' who lives through a regular day in his suburban student life... or does he????<br>
        <br>
        <br>
        Text speed: <div id="speed">Medium</div>

        <button onClick="setSpeed(14)">Slow (recommended for voiceovers)</button>
        <br>
        <button onClick="setSpeed(10)">Medium (recommended for first playthroughs)</button>
        <br>
        <button onClick="setSpeed(4)">Fast (recommended for repeat playthroughs)</button>
        <br>
        <button onClick="setSpeed(3)">A little faster (because people wanted this ig)</button>
        <br>
        <button onClick="setSpeed(1)">Lightspeed (recommended for fools, this is like 4x faster than 'Fast')</button>
        <br>
        <br>
        <button onClick="start()">START!</button>
    </div>
    <div id="buttons"></div>
</body>
